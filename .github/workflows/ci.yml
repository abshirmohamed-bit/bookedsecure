# Checks every change (ours and Lovable's) before it is published.
# Lovable deploys when someone clicks Publish, so this does not block anything:
# it puts a ✅/❌ on each commit so you know whether it is safe to publish.
name: CI

on:
  push:
    branches: [main, lovable-sync]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Lint (CI profile)
        run: bun run lint:ci

      - name: Production build
        run: bun run build
