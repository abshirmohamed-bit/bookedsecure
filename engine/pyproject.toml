[project]
name = "crayzmundo-engine"
version = "0.1.0"
description = "crayZmundo Engine — turns a long video into finished vertical clips."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pydantic-settings>=2.4",
  "python-multipart>=0.0.9",
  "httpx>=0.27",
  "ulid-py>=1.1",
]

[project.optional-dependencies]
# Installed on the host that actually runs the pipeline.
media = ["faster-whisper>=1.0", "opencv-python-headless>=4.9", "numpy>=1.26",
         "yt-dlp>=2026.8.19", "bgutil-ytdlp-pot-provider>=2.0.2", "yt-dlp-ejs>=0.8.0"]
s3 = ["boto3>=1.34"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
